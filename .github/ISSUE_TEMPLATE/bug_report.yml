name: Bug report
description: Report a problem with Parley
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: package-version
    attributes:
      label: Package/version
      description: Which `@parley/*` package(s) and version(s) are affected?
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment (Node/OS)
      description: Node version, operating system, and any other relevant environment details.
    validations:
      required: false
